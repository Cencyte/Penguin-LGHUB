# Dedicated software-only test display. Never attaches host GPUs or input.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "AutoAddGPU" "false"
    Option "DontVTSwitch" "true"
EndSection
Section "Device"
    Identifier "private-dummy"
    Driver "dummy"
    VideoRam 256000
EndSection
Section "Monitor"
    Identifier "private-monitor"
    HorizSync 5.0-1000.0
    VertRefresh 5.0-200.0
    Modeline "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +HSync +VSync
    Modeline "1024x768" 65.00 1024 1048 1184 1344 768 771 777 806 -HSync -VSync
    Modeline "800x600" 40.00 800 840 968 1056 600 601 605 628 +HSync +VSync
EndSection
Section "Screen"
    Identifier "private-screen"
    Device "private-dummy"
    Monitor "private-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080" "1024x768" "800x600"
        Virtual 1920 2160
    EndSubSection
EndSection
